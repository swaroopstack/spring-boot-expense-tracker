spring.application.name=expense-tracker

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
server.port=8080

# ---------------------------------------------------------------------------
# MySQL datasource
# The database is created automatically on the first run thanks to
# createDatabaseIfNotExist=true. Override the credentials with the
# DB_USERNAME / DB_PASSWORD environment variables if yours are different.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/expense_tracker_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------------------
# JPA / Hibernate
# "update" keeps the table in sync with the entity, which is convenient for
# learning. A production application would use migrations (Flyway/Liquibase).
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------------------
# JSON
# ---------------------------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
